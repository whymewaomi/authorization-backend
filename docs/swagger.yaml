basePath: /
definitions:
  auth_dto.ErrorResponse:
    properties:
      message:
        type: string
      status:
        type: integer
    type: object
  auth_dto.LoginUserDto:
    properties:
      password:
        maxLength: 48
        minLength: 6
        type: string
      username:
        maxLength: 32
        minLength: 4
        type: string
    required:
    - password
    - username
    type: object
  auth_dto.LoginUserResponse:
    properties:
      access_token:
        type: string
      refresh_token:
        type: string
    type: object
  auth_dto.LogoutDtoReposnse:
    properties:
      status:
        type: string
    type: object
  auth_dto.NewAccessToken:
    properties:
      access_token:
        type: string
    type: object
  auth_dto.ProfileUserResponse:
    properties:
      email:
        type: string
      id:
        type: integer
      register_at:
        type: string
      username:
        type: string
    type: object
  auth_dto.RegisterUserDTO:
    properties:
      confirm_password:
        maxLength: 48
        minLength: 6
        type: string
      email:
        type: string
      password:
        maxLength: 48
        minLength: 6
        type: string
      username:
        maxLength: 32
        minLength: 4
        type: string
    required:
    - confirm_password
    - email
    - password
    - username
    type: object
  auth_dto.RegisterUserResponse:
    properties:
      access_token:
        type: string
      email:
        type: string
      refresh_token:
        type: string
      username:
        type: string
    type: object
host: localhost:5050
info:
  contact: {}
  description: Authentication backend with JWT
  title: Authorization API
  version: "1.0"
paths:
  /api/v1/auth/login:
    post:
      consumes:
      - application/json
      description: Login with username and password
      parameters:
      - description: Login data
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/auth_dto.LoginUserDto'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth_dto.LoginUserResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/auth_dto.ErrorResponse'
      summary: Login user
      tags:
      - auth
  /api/v1/auth/logout:
    post:
      description: Logout user and invalidate refresh token
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth_dto.LogoutDtoReposnse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/auth_dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/auth_dto.ErrorResponse'
      summary: Logout user
      tags:
      - auth
  /api/v1/auth/register:
    post:
      consumes:
      - application/json
      description: Create a new account and return JWT tokens
      parameters:
      - description: Register data
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/auth_dto.RegisterUserDTO'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth_dto.RegisterUserResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/auth_dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/auth_dto.ErrorResponse'
      summary: Register new user
      tags:
      - auth
  /api/v1/profile:
    get:
      description: Returns authorized user profile
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth_dto.ProfileUserResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/auth_dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/auth_dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get user profile
      tags:
      - auth
  /api/v1/token/refresh:
    post:
      description: Generate new access token using refresh token
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth_dto.NewAccessToken'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/auth_dto.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/auth_dto.ErrorResponse'
      summary: Refresh access token
      tags:
      - auth
swagger: "2.0"
